@let user = currentUser$ | async;
<div hlmSidebarWrapper>
  <hlm-sidebar variant="inset">
    <hlm-sidebar-header>
      <ul hlmSidebarMenu>
        <li hlmSidebarMenuItem>
          <a hlmSidebarMenuButton size="lg" href="#">
            <div
              class="bg-sidebar-primary text-sidebar-primary-foreground flex aspect-square size-8 items-center justify-center rounded-lg">
              <ng-icon name="lucideCommand" class="text-base" />
            </div>
            <div class="grid flex-1 text-left text-sm leading-tight">
              <span class="truncate font-medium">Acme Inc</span>
              <span class="truncate text-xs">Enterprise</span>
            </div>
          </a>
        </li>
      </ul>
    </hlm-sidebar-header>

    <hlm-sidebar-content>
      <nav-items [items]="getNavMain(user ?? null)" />
    </hlm-sidebar-content>
    <hlm-sidebar-footer>
      <ul hlmSidebarMenu>
        <li hlmSidebarMenuItem>
          <button hlmSidebarMenuButton size="lg" [hlmDropdownMenuTrigger]="menu" [side]="_menuSide()" align="end">
            <hlm-avatar class="rounded-lg">
              <img [src]="'#'" [alt]="user?.email" hlmAvatarImage />
              <span class="rounded-lg bg-[#FD005B] text-white" hlmAvatarFallback>RG</span>
            </hlm-avatar>
            <div class="grid flex-1 text-left text-sm leading-tight">
              <span class="truncate font-medium">{{ `${user?.firstName} ${user?.lastName}` }}</span>
              <span class="truncate text-xs">{{ user?.email }}</span>
            </div>
            <ng-icon name="lucideChevronsUpDown" class="ml-auto text-base" />
          </button>
        </li>
        <ng-template #menu>
          <hlm-dropdown-menu class="min-w-56 rounded-lg">
            <hlm-dropdown-menu-label>
              <div class="flex items-center gap-2 px-1 py-1.5 text-left text-sm">
                <hlm-avatar class="rounded-lg">
                  <img [src]="'#'" [alt]="user?.email" hlmAvatarImage />
                  <span class="rounded-lg bg-[#FD005B] text-white" hlmAvatarFallback>RG</span>
                </hlm-avatar>
                <div class="grid flex-1 text-left text-sm leading-tight">
                  <span class="truncate font-medium">{{ `${user?.firstName} ${user?.lastName}` }}</span>
                  <span class="truncate text-xs">{{ user?.email }}</span>
                </div>
              </div>
            </hlm-dropdown-menu-label>
            <hlm-dropdown-menu-separator />
            <hlm-dropdown-menu-group>
              <button hlmDropdownMenuItem>
                <ng-icon name="lucideSparkles" />
                Notification
              </button>
            </hlm-dropdown-menu-group>
            <hlm-dropdown-menu-separator />
            <button hlmDropdownMenuItem (click)="logout()">
              <ng-icon name="lucideLogOut" />
              Log out
            </button>
          </hlm-dropdown-menu>
        </ng-template>
      </ul>
    </hlm-sidebar-footer>
  </hlm-sidebar>
  <ng-content />
</div>
