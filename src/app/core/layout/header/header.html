<header class="flex h-16 shrink-0 items-center gap-2">
  <div class="flex items-center gap-2 px-4">
    <button hlmSidebarTrigger></button>
    <hlm-separator orientation="vertical" class="mr-2 data-[orientation=vertical]:h-4" />
    <nav hlmBreadcrumb>
      <ol hlmBreadcrumbList>
        @for (breadcrumb of breadcrumbs(); track breadcrumb.label; let last = $last) {
          <li hlmBreadcrumbItem>
            @if (last) {
              <span hlmBreadcrumbPage>{{ breadcrumb.label }}</span>
            } @else {
              <a hlmBreadcrumbLink [routerLink]="breadcrumb.url">{{ breadcrumb.label }}</a>
            }
          </li>
          @if (!last) {
            <li hlmBreadcrumbSeparator></li>
          }
        }
      </ol>
    </nav>
  </div>
</header>
