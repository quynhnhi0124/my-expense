<div class="h-full flex-1 space-y-4 p-8 py-6">
  <table-data-header class="block" title="Users" description="Manage user accounts and access." />
  <div class="flex flex-wrap items-center gap-2">
    <table-data-toolbar class="w-full" [searchControl]="searchControl"
      [searchPlaceholder]="'Search users by first name, last name, or email'" [filterGroups]="filterGroups"
      (filterChange)="onFilterChange($event)" (clear)="clearFilters()" />
  </div>
  <app-common-table [table]="table" [loading]="loading()" emptyMessage="No users found." />
</div>
