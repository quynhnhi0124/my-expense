<hlm-dialog #userDetailsDialog="hlmDialog">
  <button
    hlmBtn
    type="button"
    size="icon-sm"
    variant="ghost"
    aria-label="User actions"
    [hlmDropdownMenuTrigger]="menu"
    align="start"
  >
    <ng-icon name="lucideEllipsis" />
  </button>
  <ng-template #menu>
    <hlm-dropdown-menu class="w-40">
      <hlm-dropdown-menu-group>
        <hlm-dropdown-menu-label>Actions</hlm-dropdown-menu-label>
      </hlm-dropdown-menu-group>
      <button hlmDropdownMenuItem [hlmDialogTriggerFor]="userDetailsDialog">Details</button>
    </hlm-dropdown-menu>
  </ng-template>

  <hlm-dialog-content *hlmDialogPortal class="sm:max-w-md">
    <hlm-dialog-header>
      <h3 hlmDialogTitle>{{ user().firstName }} {{ user().lastName }}</h3>
      <p hlmDialogDescription>User account details</p>
    </hlm-dialog-header>
    <dl class="grid gap-3 py-2 text-sm">
      <div class="flex justify-between gap-4"><dt class="text-muted-foreground">Email</dt><dd>{{ user().email }}</dd></div>
      <div class="flex justify-between gap-4"><dt class="text-muted-foreground">Role</dt><dd>{{ user().role }}</dd></div>
      <div class="flex justify-between gap-4"><dt class="text-muted-foreground">Status</dt><dd>{{ user().isActive ? 'Active' : 'Inactive' }}</dd></div>
      <div class="flex justify-between gap-4"><dt class="text-muted-foreground">Created</dt><dd>{{ user().createdAt | date:'mediumDate' }}</dd></div>
    </dl>
    <hlm-dialog-footer>
      <button hlmBtn type="button" variant="outline" hlmDialogClose>Close</button>
      @if (user().isActive) {
        <button hlmBtn type="button" variant="destructive" (click)="deactivateUser()">Deactivate user</button>
      } @else {
        <button hlmBtn type="button" variant="secondary" (click)="activateUser()">Activate user</button>
      }
    </hlm-dialog-footer>
  </hlm-dialog-content>
</hlm-dialog>
