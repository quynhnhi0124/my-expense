<div class="h-full flex-1 space-y-4 p-8 py-6">
  <table-data-header class="block" title="Expense categories" description="Manage categories used to classify expenses." />

  <div class="flex flex-wrap items-center gap-2">
    <table-data-toolbar
      class="w-full"
      [searchControl]="searchControl"
      [searchPlaceholder]="'Search categories...'"
      [filterGroups]="filterGroups"
      (filterChange)="onFilterChange($event)"
      (clear)="clearFilters()"
    >
    <button hlmBtn type="button" class="ml-auto" (click)="createDialogState.set('open')">
      Create category
    </button>
    </table-data-toolbar>
  </div>

  <hlm-dialog [state]="createDialogState()" (stateChanged)="onCreateDialogStateChange($event)">
    <hlm-dialog-content *hlmDialogPortal class="sm:max-w-xl">
      <hlm-dialog-header>
        <h3 hlmDialogTitle>Create expense category</h3>
        <p hlmDialogDescription>Define a category for organizing expense reports.</p>
      </hlm-dialog-header>

      <form [formGroup]="createCategoryForm" (ngSubmit)="createCategory()">
        <div class="grid gap-4 py-2">
          <div class="grid gap-2">
            <label for="categoryName" class="text-sm font-medium">Name</label>
            <input hlmInput id="categoryName" formControlName="name" placeholder="Category name" />
            @if (createCategoryForm.controls.name.touched && createCategoryForm.controls.name.hasError('required')) {
              <p class="text-destructive text-sm">Name is required</p>
            }
          </div>
          <div class="grid gap-2">
            <label for="categoryDescription" class="text-sm font-medium">Description</label>
            <input hlmInput id="categoryDescription" formControlName="description" placeholder="Optional details" />
          </div>
          <div class="flex items-center gap-2">
            <hlm-checkbox inputId="categoryActive" formControlName="isActive" aria-label="Active category" />
            <label for="categoryActive" class="text-sm font-medium">Active category</label>
          </div>
        </div>

        <hlm-dialog-footer class="mt-4">
          <button hlmBtn type="button" variant="outline" (click)="createDialogState.set('closed')">
            Cancel
          </button>
          <button hlmBtn type="submit" [disabled]="createCategoryForm.invalid || isSubmitting()">
            Create category
          </button>
        </hlm-dialog-footer>
      </form>
    </hlm-dialog-content>
  </hlm-dialog>

  <app-common-table [table]="table" emptyMessage="No categories found." />
</div>
